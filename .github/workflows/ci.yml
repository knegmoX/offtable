name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust（fmt / clippy / test）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features offtable-relay/dev-bridge -- -D warnings
      - run: cargo test --workspace --features offtable-relay/dev-bridge

  web:
    name: Web 构建 + 体积 + e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: 安装 wasm-bindgen / wasm-opt
        run: |
          tools/ci/install-wasm-tools.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: 构建 game.wasm
        run: scripts/build-wasm.sh
      - name: Web 构建
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
      - name: 体积预算
        run: node tools/size-report.mjs web/dist
      - name: 构建 relay（dev-bridge）
        run: cargo build -p offtable-relay --features dev-bridge --bin offtable-relay
      - name: e2e（系统 Chrome）
        env:
          RELAY_BIN: ${{ github.workspace }}/target/debug/offtable-relay
        run: |
          npm ci --prefix e2e || npm install --prefix e2e
          npx --prefix e2e playwright test -c e2e/playwright.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: web-dist
          path: |
            web/dist
            e2e/test-results
          retention-days: 7
