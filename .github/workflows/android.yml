name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 28.2.13676358

jobs:
  build:
    name: APK（按 ABI 拆分）+ AAB
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown, aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Gradle 缓存（减少对 Maven Central 的请求，避免 429）
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/src-tauri/gen/android/**/*.gradle*', 'app/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Android SDK 组件（NDK / 平台）
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;$NDK_VERSION" "platforms;android-36" "platforms;android-37.0" "build-tools;36.1.0" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: 安装 wasm-bindgen / wasm-opt
        run: |
          tools/ci/install-wasm-tools.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: 构建 game.wasm + Web
        run: |
          scripts/build-wasm.sh
          cd web && pnpm install --frozen-lockfile && pnpm build
      - name: Tauri Android 构建
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri android build --apk --aab --split-per-abi --target aarch64 armv7 x86_64 --ci
      - name: 测试签名（每次构建临时生成的密钥，仅供安装测试，不是发版密钥）
        run: |
          BT="$ANDROID_HOME/build-tools/36.1.0"
          keytool -genkeypair -keystore /tmp/ci-test.jks -alias ci -keyalg RSA -keysize 2048 -validity 30 \
            -storepass ci-test-only -keypass ci-test-only -dname "CN=Offtable CI test build" > /dev/null 2>&1
          mkdir -p out
          for apk in $(find app/src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk'); do
            abi=$(basename "$(dirname "$(dirname "$apk")")")
            "$BT/zipalign" -P 16 -f 4 "$apk" "/tmp/$abi.apk"
            "$BT/apksigner" sign --ks /tmp/ci-test.jks --ks-pass pass:ci-test-only --key-pass pass:ci-test-only \
              --out "out/offtable-${abi}-${GITHUB_SHA::7}.apk" "/tmp/$abi.apk"
          done
          find app/src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' -exec cp {} out/ \;
          ls -la out
      - name: 包体报告与门禁
        run: tools/ci/apk-report.sh out/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-${{ github.sha }}
          path: out/
          retention-days: 14
