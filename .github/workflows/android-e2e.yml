name: android-e2e

# 模拟器里的真实 App 开房 + runner 上的浏览器扫码加入，完整对局。
# 测试包开启 WebView 调试（e2e-devtools 特性）以便 Playwright 驱动主机页面；发布包不开。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 28.2.13676358

jobs:
  emulator:
    name: 模拟器端到端（App 主机 ⇄ 浏览器访客）
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown, x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Android SDK 组件
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;$NDK_VERSION" "platforms;android-37.0" "build-tools;36.1.0" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: wasm 工具 + Web 构建
        run: |
          tools/ci/install-wasm-tools.sh "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          scripts/build-wasm.sh
          cd web && pnpm install --frozen-lockfile && pnpm build
      - name: 构建测试包（x86_64，开启 WebView 调试）
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri android build --apk --target x86_64 --features e2e-devtools --ci
      - name: 测试签名
        run: |
          BT="$ANDROID_HOME/build-tools/36.1.0"
          APK=$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          keytool -genkeypair -keystore /tmp/ci-test.jks -alias ci -keyalg RSA -keysize 2048 -validity 30 \
            -storepass ci-test-only -keypass ci-test-only -dname "CN=Offtable CI e2e" > /dev/null 2>&1
          "$BT/zipalign" -P 16 -f 4 "$APK" /tmp/aligned.apk
          mkdir -p out
          "$BT/apksigner" sign --ks /tmp/ci-test.jks --ks-pass pass:ci-test-only --key-pass pass:ci-test-only \
            --out out/offtable-e2e-x86_64.apk /tmp/aligned.apk
      - name: e2e 依赖
        working-directory: e2e
        run: pnpm install --frozen-lockfile
      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 模拟器中运行
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: node e2e/android/run.mjs out/offtable-e2e-x86_64.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: android-e2e-${{ github.sha }}
          path: e2e/android-results/
          retention-days: 14
