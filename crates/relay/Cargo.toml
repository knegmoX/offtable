[package]
name = "offtable-relay"
description = "Game-agnostic LAN room relay: serves the guest page, routes WebSocket frames between guests and the host, auth + rate limits"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["server"]
server = ["dep:axum", "dep:tokio", "dep:if-addrs", "dep:getrandom"]
# 开发 / 自动化测试：/__bridge WebSocket（仅回环）代替 Tauri IPC，并提供主机外壳页面
dev-bridge = ["server", "tokio/macros", "tokio/rt-multi-thread", "tokio/signal"]

[[bin]]
name = "offtable-relay"
path = "src/main.rs"
required-features = ["dev-bridge"]

[dependencies]
offtable-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio", "query"], optional = true }
tokio = { version = "1", default-features = false, features = ["net", "sync", "rt", "time", "macros"], optional = true }
if-addrs = { version = "0.15", optional = true }
getrandom = { version = "0.4", optional = true }
