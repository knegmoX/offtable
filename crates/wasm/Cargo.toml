[package]
name = "offtable-wasm"
description = "wasm-bindgen facade: one Session API for every game, used by the app, the PWA and the LAN host worker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["gomoku"]
gomoku = ["dep:offtable-gomoku"]

[dependencies]
offtable-core.workspace = true
offtable-gomoku = { workspace = true, optional = true }
serde_json.workspace = true
wasm-bindgen = "=0.2.130"
