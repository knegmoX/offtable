[package]
name = "offtable-app"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[workspace]

[lib]
name = "offtable_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 仅 CI 模拟器端到端测试使用：release 包也开启 WebView 调试，供 Playwright 经 CDP 驱动主机页面。
# 发布包绝不开启。
e2e-devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
offtable-relay = { path = "../../crates/relay" }
serde_json = "1"

# 移动端发版：体积优先（strip 规避模板 keepDebugSymbols 问题）
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
